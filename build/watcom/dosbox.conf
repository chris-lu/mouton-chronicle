# DOSBox-X settings for running Mouton Chronicles (used by scripts\run.cmd
# and scripts\smoke-test.ps1). Only the options that matter are listed;
# DOSBox-X uses its defaults for everything else.
#
# The game runs in VGA mode 13h and waits for the vertical retrace; a 386+ CPU
# with an FPU is required (the build uses 386 instructions and x87 code).

[sdl]
windowresolution=1280x800

[dosbox]
machine=svga_s3
memsize=16

[cpu]
core=dynamic
cputype=pentium_slow
# The game paces itself on the VGA vertical retrace (~70 Hz), so extra CPU
# cycles only give effect-heavy frames (explosions, heat wave, lightning) room
# to finish within one retrace; they never make the game run faster. At a low
# fixed cycle count those frames overrun the retrace and the action stutters.
# Lower to e.g. "cycles=fixed 45000" if the game ever feels too fast.
cycles=max

[mixer]
nosound=false

# Music is CD audio (tracks 2-9 = music/mp3/*): set CDIMAGE in .env to a .cue
# image, scripts\run.cmd mounts it as D:. See docs/build-and-run.md.
