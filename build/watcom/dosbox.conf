# DOSBox-X settings for running Mouton Chronicles (used by dosbox.cmd).
# The game runs in VGA mode 13h and waits for vertical retrace; 386+ CPU
# with an FPU is required (the build uses 386 instructions and x87 code).

[sdl]
windowresolution=1280x800
output=opengl

[dosbox]
machine=svga_s3
memsize=16

[cpu]
core=auto
cputype=auto
cycles=fixed 30000

[mixer]
nosound=false

# Music is CD audio (tracks 2-9 = music/mp3/*). To hear it, build a CD image
# with those tracks and add to dosbox.cmd:  -c "imgmount d image.cue -t iso"
